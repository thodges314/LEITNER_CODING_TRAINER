<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="case-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="400" fill="#090d16" />

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Keyboard Chassis Outer Shadow & Body -->
  <g transform="translate(50, 60)">
    <rect width="500" height="280" rx="24" fill="#0b1120" stroke="#334155" stroke-width="2" />
    <rect x="8" y="8" width="484" height="264" rx="18" fill="url(#case-grad)" stroke="#1e293b" stroke-width="2" />
    <rect x="22" y="22" width="456" height="236" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

    <!-- Keyboard Keycaps Matrix -->
    <!-- Row 1: Function / Numbers -->
    <g fill="#1e293b" stroke="#334155" stroke-width="1">
      <rect x="36" y="36" width="34" height="28" rx="5" fill="url(#accent-grad)" stroke="#818cf8" />
      <rect x="76" y="36" width="28" height="28" rx="5" />
      <rect x="110" y="36" width="28" height="28" rx="5" />
      <rect x="144" y="36" width="28" height="28" rx="5" />
      <rect x="178" y="36" width="28" height="28" rx="5" />
      <rect x="212" y="36" width="28" height="28" rx="5" />
      <rect x="246" y="36" width="28" height="28" rx="5" />
      <rect x="280" y="36" width="28" height="28" rx="5" />
      <rect x="314" y="36" width="28" height="28" rx="5" />
      <rect x="348" y="36" width="28" height="28" rx="5" />
      <rect x="382" y="36" width="28" height="28" rx="5" />
      <rect x="416" y="36" width="46" height="28" rx="5" fill="#334155" />

      <!-- Row 2: QWERTY -->
      <rect x="36" y="70" width="44" height="28" rx="5" fill="#334155" />
      <rect x="86" y="70" width="28" height="28" rx="5" />
      <rect x="120" y="70" width="28" height="28" rx="5" />
      <rect x="154" y="70" width="28" height="28" rx="5" />
      <rect x="188" y="70" width="28" height="28" rx="5" fill="#4338ca" stroke="#6366f1" />
      <rect x="222" y="70" width="28" height="28" rx="5" />
      <rect x="256" y="70" width="28" height="28" rx="5" />
      <rect x="290" y="70" width="28" height="28" rx="5" />
      <rect x="324" y="70" width="28" height="28" rx="5" />
      <rect x="358" y="70" width="28" height="28" rx="5" />
      <rect x="392" y="70" width="28" height="28" rx="5" />
      <rect x="426" y="70" width="36" height="28" rx="5" fill="#334155" />

      <!-- Row 3: ASDF -->
      <rect x="36" y="104" width="50" height="28" rx="5" fill="#334155" />
      <rect x="92" y="104" width="28" height="28" rx="5" />
      <rect x="126" y="104" width="28" height="28" rx="5" />
      <rect x="160" y="104" width="28" height="28" rx="5" />
      <rect x="194" y="104" width="28" height="28" rx="5" />
      <rect x="228" y="104" width="28" height="28" rx="5" />
      <rect x="262" y="104" width="28" height="28" rx="5" />
      <rect x="296" y="104" width="28" height="28" rx="5" />
      <rect x="330" y="104" width="28" height="28" rx="5" />
      <rect x="364" y="104" width="28" height="28" rx="5" />
      <rect x="398" y="104" width="64" height="28" rx="5" fill="url(#accent-grad)" stroke="#818cf8" />

      <!-- Row 4: ZXCV -->
      <rect x="36" y="138" width="62" height="28" rx="5" fill="#334155" />
      <rect x="104" y="138" width="28" height="28" rx="5" />
      <rect x="138" y="138" width="28" height="28" rx="5" />
      <rect x="172" y="138" width="28" height="28" rx="5" />
      <rect x="206" y="138" width="28" height="28" rx="5" />
      <rect x="240" y="138" width="28" height="28" rx="5" />
      <rect x="274" y="138" width="28" height="28" rx="5" />
      <rect x="308" y="138" width="28" height="28" rx="5" />
      <rect x="342" y="138" width="28" height="28" rx="5" />
      <rect x="376" y="138" width="28" height="28" rx="5" />
      <rect x="410" y="138" width="52" height="28" rx="5" fill="#334155" />

      <!-- Row 5: Spacebar & Modifiers -->
      <rect x="36" y="172" width="38" height="28" rx="5" fill="#334155" />
      <rect x="80" y="172" width="34" height="28" rx="5" fill="#334155" />
      <rect x="120" y="172" width="38" height="28" rx="5" fill="#334155" />
      <rect x="164" y="172" width="176" height="28" rx="5" fill="#334155" stroke="#6366f1" />
      <rect x="346" y="172" width="34" height="28" rx="5" fill="#334155" />
      <rect x="386" y="172" width="34" height="28" rx="5" fill="#334155" />
      <rect x="426" y="172" width="36" height="28" rx="5" fill="#334155" />
    </g>

    <!-- Status LEDs -->
    <circle cx="440" cy="225" r="3" fill="#10b981" />
    <circle cx="452" cy="225" r="3" fill="#6366f1" />
  </g>

  <!-- Typography Label -->
  <text x="300" y="375" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">
    SERIES 75 · MECHANICAL KEYBOARD
  </text>
</svg>
