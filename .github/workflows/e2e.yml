name: Browser smoke test

# Runs every seed card (reference solution must PASS, empty solution must FAIL) in real Chromium against the
# production build. Separate from the Pages deploy so a slow/flaky browser run never blocks a deploy; run it on PRs
# and on any branch push except master.
on:
  pull_request:
  push:
    branches-ignore: ["master"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and run all cards in Chromium
        run: npm run e2e
        env:
          CI: "true"
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
